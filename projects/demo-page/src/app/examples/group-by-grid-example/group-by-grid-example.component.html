<pr-grid dir="rtl" [grid]="table"></pr-grid>
<div class="actions">
  <div class="example-button" (click)="enableGroupBy()">{{ isGroupByEnabled ? 'כבה' : 'הפעל' }} קיבוץ</div>
  <div class="example-button" (click)="collapseGroupBy()">collapse</div>
  <div class="example-button" (click)="expandGroupBy()">expand</div>
</div>
