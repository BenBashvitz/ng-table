<div class="grid-cell-wrapper" [class.selected]="selected">
  <ng-container *ngIf="cell">
    <ng-container [ngSwitch]="cell.discriminator">
      <pr-grid-text-cell
        *ngSwitchCase="'Text'"
        [cell]="cell | toFreeTextCell"
        [columnDef]="columnDef"
        [columnTitle]="columnTitle"
        (rightClick)="onEditCellRightClick()"
      ></pr-grid-text-cell>
      <ng-container *ngSwitchCase="'Component'">
        <ng-container *ngComponentOutlet="(cell | toComponentCell).component;"></ng-container>
      </ng-container>
      <pr-grid-options-cell
        *ngSwitchCase="'Options'"
        [cell]="cell | toOptionsCell"
        [columnDef]="columnDef"
        [columnTitle]="columnTitle"
        (rightClick)="onEditCellRightClick()"
      ></pr-grid-options-cell>
      <pr-grid-actions-cell
        *ngSwitchCase="'Actions'"
        [cell]="cell | toActionsCell"
        [row]="row"
      ></pr-grid-actions-cell>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!cell">
    row does not have a cell for this column
  </ng-container>
</div>
