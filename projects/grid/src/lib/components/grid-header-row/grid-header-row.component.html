<div
  class="grid-header-row"
  cdkDropList
  cdkDropListOrientation="horizontal"
  (cdkDropListDropped)="onDropColumn($event)"
  [style.grid-template-columns]="gridTemplateColumns">
  <div
    *ngFor="let column of columns; let i = index; trackBy: trackByColumn"
    cdkDrag
    cdkDragLockAxis="x"
    cdkDragPreviewContainer="parent"
    [cdkDragData]="column"
    (cdkDragStarted)="onDragStart()"
    (cdkDragEnded)="onDragEnd()"
    class="grid-header-cell"
    [class.sticky]="column.isSticky"
    [style.max-width.px]="column.maxWidthInPx"
    [style.min-width.px]="column.minWidthInPx"
    [style.right]="column.isSticky ? (gridStore.columnRightInPx$(column) | async) : 'unset'"
    [tvsColumnResize]="column"
    [gridMaxWidthInPx]="gridMaxWidth"
    [gridWidthInPx]="gridWidth"
    (contextmenu)="$event.stopPropagation(); $event.preventDefault(); onContextMenu(i)"
  >
    {{ column.title }}
    <span class="resizer"></span>
    <ng-template cdkDragPreview></ng-template>
    <mat-menu class="grid-header-actions-menu" #headerActionsMenu>
      <mat-option (click)="onRemoveColumn(column)">
        הסרת עמודה
      </mat-option>
    </mat-menu>
    <div [matMenuTriggerFor]="headerActionsMenu"></div>
  </div>
</div>
