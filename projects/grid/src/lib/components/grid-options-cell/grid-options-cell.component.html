<div class="grid-cell-text" [ngClass]="columnDef" (contextmenu)="onRightClick($event)">
  {{ cell.cellText }}
</div>
<div [matMenuTriggerFor]="menu"></div>
<mat-menu class="grid-options-cell-menu" #menu>
  <ng-container *ngFor="let option of cell.options; let i = index">
    <mat-option (click)="onClickOption(option)">
      {{ option }}
    </mat-option>
    <mat-divider *ngIf="i !== cell.options.length - 1"></mat-divider>
  </ng-container>
</mat-menu>
