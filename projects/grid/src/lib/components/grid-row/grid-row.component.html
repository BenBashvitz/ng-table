<div
  class="grid-row"
  [style.grid-template-columns]="gridTemplateColumns">
  <pr-grid-cell
    *ngFor="let column of columns;"
    [class.sticky]="column.isSticky"
    [class.selected]="selectedCells | isCellSelected:column.columnDef:row.id"
    [style.right]="column.isSticky ? (gridStore.columnRightInPx$(column) | async) : 'unset'"
    [cell]="columnToCellMapper | gridCell:column:row"
    [columnDef]="column.columnDef"
    [columnTitle]="column.title"
    (click)="onClickCell(column.columnDef)"
  ></pr-grid-cell>
</div>
