<cdk-virtual-scroll-viewport
  [itemSize]="table.rowHeightInPx"
  class="grid-viewport"
  [style.width.px]="gridWidthInPx$ | async"
>
  <div
    cdkDropList
    (cdkDropListDropped)="onDropRow($event)"
    class="grid-body"
    #body
  >
    <pr-grid-column-group-row
      [columnGroups]="table.columnGroups"
      [gridTemplateColumns]="gridTemplate$ | async"
      [gridWidth]="gridWidthInPx$ | async"
      [gridMaxWidth]="gridMaxWidthInPx$ | async"
    ></pr-grid-column-group-row>
    <pr-grid-header-row
      [columns]="columns"
      [gridTemplateColumns]="gridTemplate$ | async"
      [gridWidth]="gridWidthInPx$ | async"
      [gridMaxWidth]="gridMaxWidthInPx$ | async"
    ></pr-grid-header-row>
    <div
      *cdkVirtualFor="
        let row of table.groupByColumnIds.length > 0 ? (groupedRows$ | async) : table.rows;
        let i = index;
        trackBy: trackByRow
      "
    >
      <pr-grid-row
        *ngIf="row.discriminator === 'row'"
        cdkDrag
        [cdkDragData]="row"
        [row]="row"
        [columns]="columns"
        [columnToCellMapper]="table.columnToCellMapper"
        [gridTemplateColumns]="gridTemplate$ | async"
        (click)="onClickRow(row, i)"
        (dblclick)="onDoubleClickRow(row)"
      >
        <ng-template cdkDragPreview>
          <pr-grid-row
            [row]="row"
            [columns]="[columns[0]]"
            [columnToCellMapper]="table.columnToCellMapper"
            [gridTemplateColumns]="gridTemplate$ | async"
          ></pr-grid-row>
        </ng-template>
      </pr-grid-row>

      <pr-grid-group-by-row
        *ngIf="row.discriminator === 'groupByRow'" [groupByRow]="row"
      ></pr-grid-group-by-row>
    </div>
  </div>
  <div
    *ngFor="let selectedRow of tableStore.selectedRows$ | async"
    class="grid-row-selection"
    [style.height.px]="table.rowHeightInPx"
    [style.top.px]="64 + (selectedRow.index - virtualViewport.getRenderedRange().start) * (table.rowHeightInPx + 2)">
  </div>
</cdk-virtual-scroll-viewport>
