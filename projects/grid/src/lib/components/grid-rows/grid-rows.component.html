<cdk-virtual-scroll-viewport
  [itemSize]="table.rowHeightInPx"
  class="grid-viewport"
  [style.width.px]="gridWidthInPx$ | async"
>
  <div cdkDropList (cdkDropListDropped)="onDropRow($event)" class="grid-body" #body>
    <pr-grid-column-group-row
      [columnGroups]="table.columnGroups"
      [gridTemplateColumns]="gridTemplate$ | async"
      [gridWidth]="gridWidthInPx$ | async"
      [gridMaxWidth]="gridMaxWidthInPx$ | async"
    ></pr-grid-column-group-row>
    <pr-grid-header-row
      [columnGroups]="table.columnGroups"
      [groupByColumnIds]="table.groupByColumnIds"
      [gridTemplateColumns]="gridTemplate$ | async"
      [gridWidth]="gridWidthInPx$ | async"
      [gridMaxWidth]="gridMaxWidthInPx$ | async"
    ></pr-grid-header-row>
    <div *cdkVirtualFor="let row of displayedRows$ | async; let i = index; trackBy: trackByRow">
      <pr-grid-row
        *ngIf="row.discriminator === 'row'"
        cdkDrag
        [cdkDragData]="row"
        [row]="row"
        [columnGroups]="table.columnGroups"
        [columnToCellMapper]="table.columnToCellMapper"
        [gridTemplateColumns]="gridTemplate$ | async"
        [selectedCells]="selectedCells"
        (click)="onClickRow(row, i)"
        (dblclick)="onDoubleClickRow(row)"
      >
        <ng-template cdkDragPreview>
          <pr-grid-row
            [row]="row"
            [columnGroups]="[table.columnGroups[0]]"
            [columnToCellMapper]="table.columnToCellMapper"
            [gridTemplateColumns]="'' + columns[0].widthInPx + 'px'"
          [selectedCells]="[]"
          ></pr-grid-row>
        </ng-template>
      </pr-grid-row>

      <pr-grid-group-by-row
        *ngIf="row.discriminator === 'groupByRow'"
        [groupByRow]="row"
        [gridTemplateColumns]="gridTemplate$ | async"
        [columnsLength]="(gridStore.columnsWithSpaceAndActions$ | async).length"
        [groupLevel]="table.groupByColumnIds.indexOf(row.columnDef)"
        (toggle)="onToggleGroupByRow($event)"
      ></pr-grid-group-by-row>
    </div>
  </div>
  <div
    *ngFor="let selectedRow of gridStore.selectedRows$ | async"
    class="grid-row-selection grid-selection"
    [style.height.px]="table.rowHeightInPx"
    [style.top.px]="64 + (selectedRow.index - virtualViewport.getRenderedRange().start) * (table.rowHeightInPx + 2)"
  ></div>
  <div
    *ngFor="let selectedColumn of gridStore.selectedColumns$ | async"
    class="grid-column-selection grid-selection"
    [style.width.px]="selectedColumn.widthInPx - 2"
    [style.right]="gridStore.columnRight$(selectedColumn) | async"
  ></div>
</cdk-virtual-scroll-viewport>
