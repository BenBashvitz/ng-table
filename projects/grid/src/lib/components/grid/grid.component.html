<div class="grid">
  <pr-grid-rows
    [table]="gridStore.grid$ | async"
    [columns]="gridStore.columns$ | async"
    [selectedCells]="gridStore.selectedCells$ | async"
    [currentRows]="currentRows$ | async"
    (clickRow)="clickRow.emit($event)"
    (dblclickRow)="dblclickRow.emit($event)"
  ></pr-grid-rows>
</div>
